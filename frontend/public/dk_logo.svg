<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Outer Green 3D Ring Gradient -->
    <linearGradient id="greenRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A" />
      <stop offset="45%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>

    <!-- Outer Blue 3D Ring Gradient -->
    <linearGradient id="blueRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="50%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>

    <!-- 3D Metallic 'D' Green Gradient -->
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8E6C9" />
      <stop offset="35%" stop-color="#4CAF50" />
      <stop offset="85%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>

    <!-- 3D Metallic 'K' Blue Gradient -->
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B3E5FC" />
      <stop offset="35%" stop-color="#039BE5" />
      <stop offset="85%" stop-color="#0277BD" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="hdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Green Tilted Torus Ring -->
  <ellipse cx="260" cy="275" rx="210" ry="145" fill="none" stroke="url(#greenRingGrad)" stroke-width="48" transform="rotate(-28 260 275)" filter="url(#hdShadow)" />

  <!-- Outer Blue Intersecting Tilted Torus Ring -->
  <ellipse cx="330" cy="225" rx="210" ry="145" fill="none" stroke="url(#blueRingGrad)" stroke-width="48" transform="rotate(28 330 225)" filter="url(#hdShadow)" />

  <!-- Center 3D Metallic DK Text -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="155" filter="url(#hdShadow)">
    {/* D in Green Metallic Gradient */}
    <text x="160" y="305" fill="url(#dGrad)" stroke="#1B5E20" stroke-width="4">D</text>
    {/* K in Blue Metallic Gradient */}
    <text x="290" y="305" fill="url(#kGrad)" stroke="#01579B" stroke-width="4">K</text>
  </g>
</svg>
